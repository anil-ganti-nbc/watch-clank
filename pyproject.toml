[project]
name = "watch-clank"
version = "0.1.0"
description = "Editorial intelligence system for discovering new analog-watch releases - Stage 1: Casio Japan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "selectolax>=0.3.27",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501", "B017", "N806", "N802", "B008", "UP006", "UP007", "UP035", "TCH001", "TCH002", "TCH003", "SIM108", "B904", "A001", "A002", "C401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that require network access to official Casio sources (deselect with '-m \"not live\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"app/models/*" = ["E402"]
"tests/*" = ["E402"]
